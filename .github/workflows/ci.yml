name: CI - Calidad y Pruebas

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  calidad:
    name: Ruff + Pytest (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar errores con Ruff
        run: ruff check .

      - name: Verificar formato con Ruff
        run: ruff format --check .

      - name: Ejecutar pruebas con cobertura de dominio e infraestructura
        run: pytest --cov=src/dominio --cov=src/infraestructura --cov-report=term-missing --cov-fail-under=70
